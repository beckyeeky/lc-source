name: Update IPA source
on:
  schedule: [{cron: "17 */6 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-source
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 -m unittest discover -s tests -v
      - run: python3 gen_source.py sources.json source.json
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Generate dedicated SideStore feed
        run: python3 scripts/gen_sidestore.py
      - name: Commit if changed
        run: |
          git add -- source.json sidestore.json scripts/sidestore-cache.json icons/
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update LiveContainer and SideStore feeds" && git push
